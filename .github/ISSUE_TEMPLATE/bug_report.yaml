name: Bug Report
description: A job or runner isn't working correctly
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Include the failing workflow run, and the controller log around it
        (`~/Library/Logs/ephemeral-runners.log` on the runner Mac).

  - type: input
    id: run
    attributes:
      label: Workflow Run
      description: Link to the affected run or job, if there is one.
      placeholder: https://github.com/<org>/<repo>/actions/runs/...

  - type: input
    id: pool
    attributes:
      label: Deployment & Pool
      description: The deployment name and the pool the job used (its runs-on).
      placeholder: 'acme / tart-ubuntu'
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Runner Mac
      description: Model, RAM, and macOS version of the Mac running the controller.
      placeholder: 'Mac mini M4 Pro, 48 GB, macOS 26.6'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Queue 4 jobs on tart-macos
        2. ...
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Controller Log
      description: The lines from the controller log around the problem.
      render: text
