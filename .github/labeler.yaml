controller:
  - changed-files:
      - any-glob-to-any-file:
          - '*.go'
          - go.mod
          - go.sum

install:
  - changed-files:
      - any-glob-to-any-file:
          - scripts/**
          - launchd/**

config:
  - changed-files:
      - any-glob-to-any-file:
          - '*.example.toml'
          - .gitignore

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - LICENSE
          - examples/**
          - .github/PULL_REQUEST_TEMPLATE.md
          - .github/ISSUE_TEMPLATE/**
          - assets/**

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/labeler.yaml
