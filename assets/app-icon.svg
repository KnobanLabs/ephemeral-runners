<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- The VM: an isometric cube -->
  <g stroke="#F8FAFC" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="226,112 356,187 226,262 96,187" fill="#64748B"/>
    <polygon points="96,187 226,262 226,412 96,337" fill="url(#left)"/>
    <polygon points="226,262 356,187 356,337 226,412" fill="url(#right)"/>
  </g>

  <!-- A terminal prompt on its front face, skewed onto the left plane -->
  <g transform="matrix(1,0.577,0,1,96,187)" fill="none" stroke="#34D399" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="30,42 66,72 30,102"/>
    <line x1="78" y1="108" x2="108" y2="108"/>
  </g>

  <!-- Breaking away: the VM is thrown out after every job -->
  <g fill="#34D399">
    <rect x="384" y="214" width="40" height="40" rx="6" opacity="0.95"/>
    <rect x="404" y="150" width="30" height="30" rx="5" opacity="0.7"/>
    <rect x="442" y="106" width="22" height="22" rx="4" opacity="0.45"/>
    <rect x="452" y="200" width="18" height="18" rx="3" opacity="0.35"/>
    <rect x="470" y="62" width="14" height="14" rx="3" opacity="0.2"/>
  </g>
</svg>
